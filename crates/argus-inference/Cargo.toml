[package]
name = "argus-inference"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argus-features = { path = "../argus-features" }
argus-model-artifact = { path = "../argus-model-artifact" }
argus-moe = { path = "../argus-moe" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-27", "load-dynamic", "std"] }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
argus-capture = { path = "../argus-capture" }
argus-core = { path = "../argus-core" }

[lints]
workspace = true
