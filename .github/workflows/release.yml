name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: windows-latest
    env:
      # GitHub does not allow the secrets context in step-level `if` conditions,
      # so the presence check reads this job-level environment variable instead.
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --locked --workspace --all-targets

      - name: Build release binaries
        run: ./scripts/build-windows.ps1
        shell: pwsh

      - name: Optionally sign release binaries
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          foreach ($file in @('target/release/argus-desktop.exe', 'target/release/argus-nids.exe', 'target/release/argus-pktmon-stream.exe')) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }
          }

      - name: Build portable package
        run: ./scripts/package-windows.ps1 -OutputDirectory dist
        shell: pwsh

      - name: Build setup program
        run: ./scripts/build-installer.ps1 -PackageDirectory dist/ArgusNextPublic-windows-x64 -OutputPath dist/setup/ArgusNextPublic-windows-x64-setup.exe -Version ${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Installer smoke test
        run: ./scripts/test-installer.ps1 -SetupPath dist/setup/ArgusNextPublic-windows-x64-setup.exe
        shell: pwsh

      # The current setup container reads its payload footer from EOF.
      # Authenticode appends a certificate table, so signing the setup itself
      # requires certificate-aware parsing and a post-sign install test first.
      - name: Remove temporary signing key
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          Remove-Item $pfx -Force

      - name: Bundle portable package
        shell: pwsh
        run: |
          $zip = 'dist/ArgusNextPublic-windows-x64.zip'
          $setup = 'dist/setup/ArgusNextPublic-windows-x64-setup.exe'
          $lines = Get-ChildItem dist/ArgusNextPublic-windows-x64 -Recurse -File | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath((Resolve-Path 'dist/ArgusNextPublic-windows-x64'), $_.FullName)
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $rel
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  ArgusNextPublic-windows-x64.zip"
            "$setupHash  ArgusNextPublic-windows-x64-setup.exe"
          ) | Set-Content -LiteralPath dist/SHA256SUMS-RELEASE.txt -Encoding utf8NoBOM

      - name: Prepare SBOM output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist/sbom | Out-Null

      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom/argus-next.cdx.json

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/setup/ArgusNextPublic-windows-x64-setup.exe
            dist/ArgusNextPublic-windows-x64.zip

      - name: Upload validation artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-validation
          path: |
            dist/setup/ArgusNextPublic-windows-x64-setup.exe
            dist/ArgusNextPublic-windows-x64.zip
            dist/SHA256SUMS-RELEASE.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prerelease = '${{ steps.version.outputs.prerelease }}'
          $args = @(
            'release', 'create', '${{ github.ref_name }}',
            'dist/setup/ArgusNextPublic-windows-x64-setup.exe',
            'dist/ArgusNextPublic-windows-x64.zip',
            'dist/SHA256SUMS-RELEASE.txt',
            'dist/sbom/argus-next.cdx.json',
            '--title', "Argus Next ${{ steps.version.outputs.version }}",
            '--generate-notes'
          )
          if ($prerelease -eq 'True') { $args += '--prerelease' }
          gh @args
