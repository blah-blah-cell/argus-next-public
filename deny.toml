[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
# The unic-* crates are unmaintained and reachable only through
# tauri-utils -> urlpattern. There is no upgrade path and no known
# vulnerability; revisit when Tauri drops urlpattern.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unmaintained unic-char-range, transitive via tauri-utils" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained unic-common, transitive via tauri-utils" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained unic-char-property, transitive via tauri-utils" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained unic-ucd-version, transitive via tauri-utils" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained unic-ucd-ident, transitive via tauri-utils" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path with no published version yet.
# External wildcard requirements are still denied.
allow-wildcard-paths = true
deny = []

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
